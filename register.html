<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoomMatch - Crear cuenta</title>
    <link rel="icon" sizes="64x64" href="img/assets/logo-roommatch.png" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/register.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="contenedor-register">
    <div class="register-caja">
      <h1>Crear cuenta</h1>
      <p class="subtitulo">Únete a la comunidad de RoomMatch</p>

      <form id="form-register" action="#" method="post">
        <label for="reg-name">Nombre completo</label>
        <input
          id="reg-name"
          type="text"
          placeholder="John Doe"
          autocomplete="name"
          required
        />

        <label for="reg-email">Correo electrónico</label>
        <input
          id="reg-email"
          type="email"
          placeholder="ejemplo@correo.com"
          autocomplete="email"
          required
        />

        <label for="reg-pass">Contraseña</label>
        <div class="campo-pass">
          <input type="password" placeholder="••••••••" />
          <button class="btn-toggle-pass">
            <i class="fa-solid fa-eye" id="eye-icon"></i>
          </button>
        </div>

        <button type="submit" class="btn-register-submit">Registrarse</button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span>O CONTINÚA CON</span>
        <div class="divider-line"></div>
      </div>

      <div class="register-social">
        <button class="btn-social" aria-label="Continuar con Google">
          <i class="fa-brands fa-google"></i>
        </button>
        <button class="btn-social" aria-label="Continuar con Facebook">
          <i class="fa-brands fa-facebook"></i>
        </button>
      </div>

      <p class="login-link">
        ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
      </p>
    </div>
  </body>
  <script src="js/register.js"></script>
</html>
